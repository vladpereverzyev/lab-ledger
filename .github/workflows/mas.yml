name: Mac App Store

# Builds the sandboxed Mac App Store package and, when asked, uploads it to
# App Store Connect. Submitting it for review stays a manual step there.
#
# Everything personal lives in the repository secrets, never in the repo:
#   MAS_CERTS            base64 .p12 with the Apple Distribution certificate
#   MAS_CERTS_PASSWORD   its password
#   MAS_INSTALLER_CERTS  base64 .p12 with the Mac Installer Distribution
#                        certificate
#   MAS_INSTALLER_CERTS_PASSWORD its password
#   MAS_PROVISION_PROFILE base64 Mac App Store provisioning profile
#   APPLE_API_KEY        App Store Connect API key (.p8 contents)
#   APPLE_API_KEY_ID     its key ID
#   APPLE_API_ISSUER     its issuer ID

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload the package to App Store Connect"
        type: boolean
        default: false
      build_version:
        description: "Build number (CFBundleVersion), when the same version is uploaded again"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  mas:
    # macOS 26 with Xcode 26: its actool compiles the Icon Composer icon
    # (build/icon.icon) the App Store build carries.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcrun actool --version | head -5

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Provisioning profile and API key
        env:
          MAS_PROVISION_PROFILE: ${{ secrets.MAS_PROVISION_PROFILE }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY }}
        run: |
          printf '%s' "$MAS_PROVISION_PROFILE" | base64 --decode > build/embedded.provisionprofile
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$APPLE_API_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8

      # Both certificates go into one throwaway keychain here, rather than
      # through CSC_LINK and CSC_INSTALLER_LINK: electron-builder creates its
      # keychain twice for the two of them and then cannot unlock it.
      - name: Signing keychain
        env:
          MAS_CERTS: ${{ secrets.MAS_CERTS }}
          MAS_CERTS_PASSWORD: ${{ secrets.MAS_CERTS_PASSWORD }}
          MAS_INSTALLER_CERTS: ${{ secrets.MAS_INSTALLER_CERTS }}
          MAS_INSTALLER_CERTS_PASSWORD: ${{ secrets.MAS_INSTALLER_CERTS_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/mas.keychain"
          KC_PASS="$(openssl rand -hex 24)"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          printf '%s' "$MAS_CERTS" | base64 --decode > "$RUNNER_TEMP/app.p12"
          printf '%s' "$MAS_INSTALLER_CERTS" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/app.p12" -k "$KC" -P "$MAS_CERTS_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security import "$RUNNER_TEMP/installer.p12" -k "$KC" -P "$MAS_INSTALLER_CERTS_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          rm -f "$RUNNER_TEMP/app.p12" "$RUNNER_TEMP/installer.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v "$KC" | grep -c "valid identities" || true

      - name: Build Mac App Store package
        run: npm run dist:mas -- ${{ inputs.build_version && format('-c.buildVersion={0}', inputs.build_version) || '' }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: true
          CSC_KEYCHAIN: ${{ runner.temp }}/mas.keychain

      - uses: actions/upload-artifact@v7
        with:
          name: lab-ledger-dental-mas
          path: release/mas-*/*.pkg

      - name: Upload to App Store Connect
        if: inputs.upload
        run: |
          xcrun altool --upload-app --type macos \
            --file "$(ls release/mas-*/*.pkg | head -1)" \
            --apiKey "${{ secrets.APPLE_API_KEY_ID }}" \
            --apiIssuer "${{ secrets.APPLE_API_ISSUER }}"

      - name: Remove the secrets from the runner
        if: always()
        run: |
          rm -f build/embedded.provisionprofile ~/.appstoreconnect/private_keys/*.p8
          security delete-keychain "$RUNNER_TEMP/mas.keychain" || true

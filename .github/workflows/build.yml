name: Build installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build installer
        run: npm run dist
        env:
          # Do not attempt macOS code signing (no certificate configured).
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # SHA-256 of every artifact this runner built, so a download can be
      # verified against a published sum. One file per OS to avoid three jobs
      # overwriting the same name on the release.
      - name: Checksums
        shell: bash
        run: |
          node -e "const fs=require('fs'),c=require('crypto');const d='release';const out=[];for(const f of fs.readdirSync(d).sort()){const fp=d+'/'+f;if(!fs.statSync(fp).isFile()||f.startsWith('SHA256SUMS'))continue;out.push(c.createHash('sha256').update(fs.readFileSync(fp)).digest('hex')+'  '+f);}fs.writeFileSync(d+'/SHA256SUMS-'+process.env.RUNNER_OS+'.txt', out.join('\n')+'\n');"
          cat "release/SHA256SUMS-$RUNNER_OS.txt"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lab-ledger-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/SHA256SUMS-*.txt

      # The notes are the CHANGELOG section for this tag, not auto-generated
      # ones: three matrix jobs publish to the same release, and generated
      # notes would be appended three times and would link to whatever the
      # previous tag happened to be.
      - name: Release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v hdr="## [$version]" '
            index($0, hdr) == 1 { flag = 1; next }
            flag && index($0, "## [") == 1 { exit }
            flag { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/SHA256SUMS-*.txt

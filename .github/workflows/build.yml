name: Build installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      HAS_APPLE_KEY: ${{ secrets.APPLE_API_KEY != '' }}
      HAS_MAC_CERTS: ${{ secrets.MAC_CERTS != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          # Electron 44 installs only on Node 22.12 or newer.
          node-version: 22

      - name: Install dependencies
        run: npm install

      # The App Store Connect API key notarizes the macOS build. It lives in
      # the repository secrets only and is written to the runner's temp folder.
      - name: Apple API key
        if: runner.os == 'macOS' && env.HAS_APPLE_KEY == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY }}
        run: printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple-api-key.p8"

      # The Developer ID certificate goes into a throwaway keychain here: when
      # electron-builder imports it itself, it cannot unlock its own keychain.
      - name: Signing keychain
        if: runner.os == 'macOS' && env.HAS_MAC_CERTS == 'true'
        env:
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/mac.keychain"
          KC_PASS="$(openssl rand -hex 24)"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          printf '%s' "$MAC_CERTS" | base64 --decode > "$RUNNER_TEMP/app.p12"
          security import "$RUNNER_TEMP/app.p12" -k "$KC" -P "$MAC_CERTS_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/app.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')

      - name: Build installer
        run: npm run dist
        env:
          # macOS is signed with the Developer ID certificate from the keychain
          # above and notarized; Windows and Linux are never signed here.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ runner.os == 'macOS' && env.HAS_MAC_CERTS == 'true' }}
          CSC_KEYCHAIN: ${{ runner.os == 'macOS' && env.HAS_MAC_CERTS == 'true' && format('{0}/mac.keychain', runner.temp) || '' }}
          APPLE_API_KEY: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY != '' && format('{0}/apple-api-key.p8', runner.temp) || '' }}
          APPLE_API_KEY_ID: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}

      # SHA-256 of every file this runner publishes, so a download can be
      # verified with `sha256sum -c`. Only the published installers are listed
      # (not latest.yml, blockmaps or builder-debug.yml), and spaces in their
      # names become dots first, as GitHub renames them on the release, so the
      # names in the sums match the downloads. One file per OS to avoid three
      # jobs overwriting the same name on the release.
      - name: Checksums
        shell: bash
        run: |
          node -e "const fs=require('fs'),c=require('crypto');const d='release';const out=[];for(let f of fs.readdirSync(d).sort()){if(!/\.(exe|dmg|zip|AppImage|deb)$/.test(f)||!fs.statSync(d+'/'+f).isFile())continue;const g=f.replace(/ /g,'.');if(g!==f){fs.renameSync(d+'/'+f,d+'/'+g);f=g;}out.push(c.createHash('sha256').update(fs.readFileSync(d+'/'+f)).digest('hex')+'  '+f);}fs.writeFileSync(d+'/SHA256SUMS-'+process.env.RUNNER_OS+'.txt', out.join('\n')+'\n');"
          cat "release/SHA256SUMS-$RUNNER_OS.txt"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lab-ledger-dental-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/SHA256SUMS-*.txt

      # The notes are the CHANGELOG section for this tag, not auto-generated
      # ones: three matrix jobs publish to the same release, and generated
      # notes would be appended three times and would link to whatever the
      # previous tag happened to be.
      - name: Release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v hdr="## [$version]" '
            index($0, hdr) == 1 { flag = 1; next }
            flag && index($0, "## [") == 1 { exit }
            flag { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/SHA256SUMS-*.txt
